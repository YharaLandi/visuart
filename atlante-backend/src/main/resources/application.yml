spring:
  application:
    name: atlante-backend
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  profiles:
    default: dev
  config:
    # Chiavi e password locali, fuori dal repository (vedi secrets.example.yml)
    import: optional:file:./secrets.yml
  mail:
    # Gmail: serve una "password per le app" (Account Google > Sicurezza > Verifica in due
    # passaggi > Password per le app). Mai scriverla qui: in locale va in secrets.yml,
    # in produzione nella variabile MAIL_PASSWORD. Senza, le mail non partono e il link
    # di reset viene scritto nel log.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:comunication.visuart@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:VisuArt <comunication.visuart@gmail.com>}
  password-reset:
    expiration-minutes: 30
  seed:
    # Carica opere, connessioni e utenti demo se il database è vuoto
    enabled: ${SEED_DEMO:true}
    # Password degli utenti demo admin e curatore: in produzione va cambiata
    password: ${ADMIN_PASSWORD:password123}
  jwt:
    # Stringa Base64 di almeno 32 byte (es. `openssl rand -base64 48`). In produzione: env var.
    secret: ${JWT_SECRET:YXRsYW50ZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1wbGVhc2UtdXNlLWVudi12YXItMDEyMzQ1Njc4OQ==}
    expiration-ms: 86400000
  cors:
    # Origini del frontend ammesse sia dalle API REST sia dall'handshake WebSocket
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  tmdb:
    # Da secrets.yml in locale, da TMDB_API_KEY in produzione
    api-key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p/w500
  met:
    base-url: https://collectionapi.metmuseum.org/public/collection/v1
  llm:
    # Client unico per le funzioni AI, formato /chat/completions compatibile OpenAI.
    # Di default punta all'endpoint OpenAI-compatibile di Gemini; per OpenRouter o altri
    # basta cambiare base-url, model e chiave. Chiave da https://aistudio.google.com.
    # In produzione: env var LLM_API_KEY (GEMINI_API_KEY resta valida come alias).
    api-key: ${LLM_API_KEY:${GEMINI_API_KEY:}}
    model: ${LLM_MODEL:gemini-3.8-flash}
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    max-tokens: 4096
  images:
    storage-dir: ${IMAGE_DIR:./storage/images}

# Solo /actuator/health è esposto (health check di Render), senza dettagli interni
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Database su file: utenti e dati restano tra un riavvio e l'altro.
    # Per ripartire da zero basta cancellare la cartella ./data
    url: jdbc:h2:file:./data/atlante;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlante}
    username: ${DB_USER:atlante}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Senza migrazioni (Flyway) lo schema viene allineato da Hibernate all'avvio
      ddl-auto: update
